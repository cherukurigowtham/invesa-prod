services:
  - type: web
    name: invesa-app
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/cherukurigowtham/invesa-prod.git
    branch: codex/deploy
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
