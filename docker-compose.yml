version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - JWT_SECRET=super_secret_production_key_123
      # Postgres database is self-contained inside this container's tmp dir for local/HF compatibility
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: always
