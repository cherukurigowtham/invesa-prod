[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.0", features = ["macros", "ws"] }
tokio = { version = "1.43.0", features = ["full"] }
futures-util = "0.3.31"
sqlx = { version = "0.8.3", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
jsonwebtoken = "9.3.0"
bcrypt = "0.16.0"
uuid = { version = "1.13.1", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
dotenvy = "0.15.7"
tower-http = { version = "0.6.2", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "registry", "fmt"] }
validator = { version = "0.18", features = ["derive"] }
sentry = { version = "0.34.0", features = ["tracing", "tower-axum-matched-path"] }
reqwest = { version = "0.12.12", features = ["json"] }

