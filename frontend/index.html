<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SEO: Primary meta tags -->
    <title>Invesa — Collaborative Startup Workspace for Founders, Builders & Investors</title>
    <meta name="title" content="Invesa — Collaborative Startup Workspace for Founders, Builders & Investors" />
    <meta name="description" content="Invesa is the all-in-one startup collaboration platform. Post startup ideas, find co-founders and builders, manage equity cap tables, simulate dilution, and connect with investors — all in one secure workspace." />
    <meta name="author" content="Invesa" />
    <meta name="keywords" content="startup workspace, equity management, cap table, co-founder matching, investor connections, startup ideas, vesting schedule, dilution simulator" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://invesaa.vercel.app/" />
    <meta property="og:title" content="Invesa — Collaborative Startup Workspace" />
    <meta property="og:description" content="Post startup ideas, find co-founders, simulate cap tables, and connect with investors on Invesa — the collaborative startup workspace." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://invesaa.vercel.app/" />
    <meta property="twitter:title" content="Invesa — Collaborative Startup Workspace" />
    <meta property="twitter:description" content="Post startup ideas, find co-founders, simulate cap tables, and connect with investors on Invesa." />

    <!-- PWA & Mobile -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Fonts: preconnect for speed, then async load with font-display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the most-used font weight first to avoid FOIT -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <!-- Performance: DNS prefetch & preconnect for backend API -->
    <link rel="preconnect" href="https://invesa-backend.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://invesa-backend.onrender.com" />
  </head>
  <body>
    <!--
      Pre-seed the root background so there's no white→dark flash (CLS).
      React replaces this div's content but the bg is already set.
    -->
    <div id="root" style="background:#202124;min-height:100vh;color:#fff;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
